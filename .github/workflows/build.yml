name: Build Fabric

concurrency:
  group: "build"
  cancel-in-progress: false

on:
  push:
    branches:
      - "1.21.11"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build -Pbuild_number=${{ github.run_number }} -Pcommit=${{ github.sha }}

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: meteor-client-fabric-${{ github.run_number }}
          path: build/libs/meteor-client-*.jar
          retention-days: 30
