name: Build Fabric

concurrency:
  group: "build"
  cancel-in-progress: false

on:
  push:
    branches:
      - "1.21.11"
  workflow_dispatch:

jobs:
  build-meteor-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build -Pbuild_number=${{ github.run_number }} -Pcommit=${{ github.sha }}

      - name: Upload Meteor Client JAR
        uses: actions/upload-artifact@v4
        with:
          name: meteor-client-${{ github.run_number }}
          path: build/libs/meteor-client-*.jar
          retention-days: 30

  build-meteorist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build Meteorist
        run: cd Meteorist && chmod +x gradlew && ./gradlew build --no-daemon -Pbuild_number=${{ github.run_number }}

      - name: Upload Meteorist JAR
        uses: actions/upload-artifact@v4
        with:
          name: meteorist-${{ github.run_number }}
          path: Meteorist/build/libs/*.jar
          retention-days: 30

  build-meteorplus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build MeteorPlus
        run: |
          cd MeteorPlus
          chmod +x gradlew
          echo "=== Checking dependency JARs for .accesswidener files ==="
          for jar in $(find ~/.gradle/caches -name "*.jar" -path "*/whereisit/*" 2>/dev/null) libs/*.jar; do
            [ -f "$jar" ] || continue
            aw=$(unzip -p "$jar" '*.accesswidener' 2>/dev/null | head -1)
            if [ -n "$aw" ]; then
              echo "FOUND AW in: $(basename $jar) -> $aw"
            fi
          done
          echo "========================================"
          echo "=== Searching ALL cached JARs for AW files with 'official' namespace ==="
          find ~/.gradle/caches -name "*.jar" -exec sh -c 'header=$(unzip -p "$1" "*.accesswidener" 2>/dev/null | head -1); if echo "$header" | grep -q "official"; then echo "OFFICIAL AW: $1 -> $header"; fi' _ {} \; 2>/dev/null | head -20
          echo "========================================"
          ./gradlew build --no-daemon --stacktrace -Pbuild_number=${{ github.run_number }}

      - name: Upload MeteorPlus JAR
        uses: actions/upload-artifact@v4
        with:
          name: meteorplus-${{ github.run_number }}
          path: MeteorPlus/build/libs/*.jar
          retention-days: 30

  build-numbyhack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build Numby Hack
        run: cd Numby-hack && chmod +x gradlew && ./gradlew build --no-daemon -Pbuild_number=${{ github.run_number }}

      - name: Upload Numby Hack JAR
        uses: actions/upload-artifact@v4
        with:
          name: numbyhack-${{ github.run_number }}
          path: Numby-hack/build/libs/*.jar
          retention-days: 30
